# PostgreSQL server logs (postgresql-*.log, log_line_prefix of any shape).
# Server logs never "finish", so state checks are off: every log shows as RUNNING.
TL_GLOB='*.log *.csv *.json'
TL_HIGHLIGHT=word
# stderr / csvlog / jsonlog formats all covered
TL_RED_RE='PANIC:|FATAL:|ERROR:|,(PANIC|FATAL|ERROR),|"error_severity":"(PANIC|FATAL|ERROR)"'
TL_AMBER_RE='WARNING:|,WARNING,|"error_severity":"WARNING"'
TL_YELLOW_RE='NOTICE:|HINT:|,NOTICE,|"error_severity":"NOTICE"'
TL_GREEN_RE='database system is ready to accept connections|checkpoint complete'
TL_BLUE_RE='LOG:  duration:|LOG:  process [0-9]+ (still waiting|acquired)|deadlock'
TL_DIM_RE='DEBUG[1-5]?:|STATEMENT:|CONTEXT:|DETAIL:'
TL_OK_RE=''
TL_FAIL_RE=''
TL_WARN_RE=''
