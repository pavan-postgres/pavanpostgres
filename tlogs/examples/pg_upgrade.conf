# pg_upgrade / pg_upgradecluster runs: one log per cluster being upgraded.
# pg_upgrade prints "Upgrade Complete" on success and "Failure, exiting" on failure.
TL_GLOB='*.log *.txt'
TL_RED_RE='Failure, exiting|fatal|FATAL|ERROR|could not'
TL_AMBER_RE='WARNING|warning'
TL_YELLOW_RE='NOTICE|Consult the last few lines'
TL_GREEN_RE='Upgrade Complete|  ok$'
TL_DIM_RE=''
TL_OK_RE='Upgrade Complete'
TL_FAIL_RE='Failure, exiting'
TL_WARN_RE='WARNING|warning'
TL_TAIL_LINES=15
