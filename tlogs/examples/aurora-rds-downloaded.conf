# Logs downloaded from Amazon RDS / Aurora PostgreSQL, e.g.:
#   aws rds download-db-log-file-portion --db-instance-identifier mydb \
#       --log-file-name error/postgresql.log.2026-10-12-10 --output text > mydb.log
# (one file per instance; re-run the download in a loop to keep it growing)
TL_GLOB='*.log'
TL_HIGHLIGHT=word
TL_RED_RE='PANIC:|FATAL:|ERROR:'
TL_AMBER_RE='WARNING:'
TL_YELLOW_RE='NOTICE:'
TL_GREEN_RE='database system is ready'
TL_DIM_RE='STATEMENT:|CONTEXT:|DETAIL:'
TL_OK_RE=''
TL_FAIL_RE=''
TL_WARN_RE=''
