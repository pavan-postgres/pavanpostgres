# Any script/job that writes one log per run (migrations, backfills, deploys, ansible, cron).
# Make your jobs print a clear last line - tlogs only needs that.
TL_GLOB='*.log *.out'
TL_ICASE=1
TL_RED_RE='error|exception|traceback|failed|fatal'
TL_AMBER_RE='warn|retry|timeout'
TL_YELLOW_RE='notice|skipp'
TL_GREEN_RE='success|completed|done'
TL_DIM_RE='debug'
TL_OK_RE='job (finished|completed)|exit(ed)? (code|status)[ :=]*0$'
TL_FAIL_RE='job failed|aborted|exit(ed)? (code|status)[ :=]*[1-9]'
TL_WARN_RE='warn'
